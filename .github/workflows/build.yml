name: Build OptimizerX Deb

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build rootless .deb
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make clang fakeroot dpkg-dev \
            libssl-dev libplist-dev libxml2-dev libz-dev \
            zip unzip xz-utils curl

      - name: Set Theos env
        run: |
          echo "THEOS=$HOME/theos"                     >> $GITHUB_ENV
          echo "THEOS_MAKE_PATH=$HOME/theos/makefiles" >> $GITHUB_ENV

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-ubuntu-v3

      - name: Clone Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          git clone --recursive --depth 1 \
            https://github.com/theos/theos.git $THEOS

      - name: Download iOS 16.5 SDK
        run: |
          set -e
          mkdir -p "$THEOS/sdks"
          cd "$THEOS/sdks"
          if [ -d "iPhoneOS16.5.sdk" ]; then
            echo "✅ SDK đã có sẵn"
            exit 0
          fi

          URLS=(
            "https://github.com/theos/sdks/releases/download/iPhoneOS16.5.sdk/iPhoneOS16.5.sdk.tar.xz"
            "https://github.com/xybp888/iOS-SDKs/releases/download/16.5/iPhoneOS16.5.sdk.tar.xz"
            "https://github.com/Lessica/iOS-SDKs/raw/master/iPhoneOS16.5.sdk.tar.xz"
          )

          for URL in "${URLS[@]}"; do
            echo "⬇️  Thử: $URL"
            if curl -L -f --connect-timeout 15 --max-time 300 -o sdk.tar.xz "$URL"; then
              SIZE=$(stat -c%s sdk.tar.xz)
              if [ "$SIZE" -gt 1000000 ] && file sdk.tar.xz | grep -q "XZ compressed"; then
                echo "✅ Tải xong: $SIZE bytes"
                tar -xf sdk.tar.xz
                rm -f sdk.tar.xz
                break
              else
                echo "⚠️  File không hợp lệ ($SIZE bytes)"
                rm -f sdk.tar.xz
              fi
            fi
          done

          test -d "iPhoneOS16.5.sdk" || { echo "❌ Không tải được SDK"; exit 1; }
          ls -la

      - name: Download ldid
        run: |
          mkdir -p "$THEOS/toolchain/linux/iphone/bin"
          if [ ! -x "$THEOS/toolchain/linux/iphone/bin/ldid" ]; then
            curl -L -o "$THEOS/toolchain/linux/iphone/bin/ldid" \
              https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
            chmod +x "$THEOS/toolchain/linux/iphone/bin/ldid"
          fi
          "$THEOS/toolchain/linux/iphone/bin/ldid" -v

      - name: Build .deb
        run: |
          rm -rf .theos packages
          make package FINALPACKAGE=1

      - name: Verify package
        run: |
          ls -lh packages/
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          dpkg-deb -c packages/*.deb
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          dpkg-deb -I packages/*.deb

      - name: Rename output
        run: |
          mkdir -p dist
          VERSION=$(grep '^Version:' control | awk '{print $2}')
          cp packages/*.deb "dist/optimizerx_${VERSION}_iphoneos-arm64.deb"
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OptimizerX-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: OptimizerX-deb
          path: release

      - name: Add checksums
        run: |
          cd release
          sha256sum *.deb > SHA256SUMS.txt
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OptimizerX ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/*.deb
            release/SHA256SUMS.txt
