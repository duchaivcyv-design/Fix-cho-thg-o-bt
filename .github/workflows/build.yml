name: Build OptimizerX

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ═══════════════════════════════════════════════════════════
  # JOB 1 — Build rootless .deb (mặc định cho iOS 15-16)
  # ═══════════════════════════════════════════════════════════
  build-rootless:
    name: Build Rootless (iOS 15-16)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make clang fakeroot dpkg-dev \
            libssl-dev libplist-dev libxml2-dev libz-dev \
            zip unzip xz-utils curl

      - name: Set env
        run: |
          echo "THEOS=$HOME/theos"               >> $GITHUB_ENV
          echo "THEOS_MAKE_PATH=$HOME/theos/makefiles" >> $GITHUB_ENV

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-ubuntu-${{ hashFiles('.github/workflows/build.yml') }}-v2

      - name: Clone Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          git clone --recursive --depth 1 \
            https://github.com/theos/theos.git $THEOS

      - name: Ensure SDK exists
        run: |
          mkdir -p $THEOS/sdks
          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            cd $THEOS/sdks
            curl -L -o sdk.tar.xz \
              https://github.com/theos/sdks/raw/master/iPhoneOS16.5.sdk.tar.xz
            tar -xf sdk.tar.xz
            rm sdk.tar.xz
          fi

      - name: Ensure ldid exists
        run: |
          mkdir -p $THEOS/toolchain/linux/iphone/bin
          if [ ! -x "$THEOS/toolchain/linux/iphone/bin/ldid" ]; then
            curl -L -o $THEOS/toolchain/linux/iphone/bin/ldid \
              https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
            chmod +x $THEOS/toolchain/linux/iphone/bin/ldid
          fi

      - name: Build rootless
        run: |
          rm -rf .theos packages
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Verify
        run: |
          ls -lh packages/
          dpkg-deb -c packages/*.deb

      - name: Rename output
        run: |
          mkdir -p dist
          VERSION=$(grep '^Version:' control | awk '{print $2}')
          cp packages/*.deb dist/optimizerx-rootless_${VERSION}.deb

      - uses: actions/upload-artifact@v4
        with:
          name: deb-rootless
          path: dist/*.deb

  # ═══════════════════════════════════════════════════════════
  # JOB 2 — Build rootful .deb (iOS 14-15)
  # ═══════════════════════════════════════════════════════════
  build-rootful:
    name: Build Rootful (iOS 14-15)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make clang fakeroot dpkg-dev \
            libssl-dev libplist-dev libxml2-dev libz-dev \
            zip unzip xz-utils curl

      - name: Set env
        run: |
          echo "THEOS=$HOME/theos"               >> $GITHUB_ENV
          echo "THEOS_MAKE_PATH=$HOME/theos/makefiles" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-ubuntu-${{ hashFiles('.github/workflows/build.yml') }}-v2

      - name: Clone Theos
        run: |
          if [ ! -d "$THEOS" ]; then
            git clone --recursive --depth 1 \
              https://github.com/theos/theos.git $THEOS
          fi

      - name: Ensure SDK + ldid
        run: |
          mkdir -p $THEOS/sdks
          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            cd $THEOS/sdks
            curl -L -o16 sdk.tar.xz \
              https.://github.com/theos/sdks/raw/master/iPhoneOS5.sdk.tar.xz
            tar -xf sdk.tar.xz && rm sdk.tar.xz
          fi

          mkdir -p $THEOS/toolchain/linux/iphone/bin
          if [ ! -x "$THEOS/toolchain/linux/iphone/bin/ldid" ]; then
            curl -L -o $THEOS/toolchain/linux/iphone/bin/ldid \
              https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
            chmod +x $THEOS/toolchain/linux/iphone/bin/ldid
          fi

      - name: Patch control for rootful
        run: |
          sed -i 's/^Architecture:.*/Architecture: iphoneos-arm/' control
          sed -i 's/^THEOS_PACKAGE_SCHEME.*/# THEOS_PACKAGE_SCHEME = rootless/' Makefile || true

      - name: Build rootful
        run: |
          rm -rf .theos packages
          make package FINALPACKAGE=1

      - name: Rename output
        run: |
          mkdir -p dist
          VERSION=$(grep '^Version:' control | awk '{print $2}')
          cp packages/*.deb dist/optimizerx-rootful_${VERSION}.deb

      - uses: actions/upload-artifact@v4
        with:
          name: deb-rootful
          path: dist/*.deb

  # ═══════════════════════════════════════════════════════════
  # JOB 3 — Release (chỉ chạy khi push tag)
  # ═══════════════════════════════════════════════════════════
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [ build-rootless, build-rootful ]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release
        run: |
          mkdir -p release
          find artifacts -name '*.deb' -exec cp {} release/ \;
          cd release
          sha256sum *.deb > SHA256SUMS.txt

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OptimizerX v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/*.deb
            release/SHA256SUMS.txt

  # ═══════════════════════════════════════════════════════════
  # JOB 4 — Summary
  # ═══════════════════════════════════════════════════════════
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [ build-rootless, build-rootful ]
    if: always()

    steps:
      - run: |
          echo "## 🎯 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scheme | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Rootless | ${{ needs.build-rootless.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rootful  | ${{ needs.build-rootful.result }} |" >> $GITHUB_STEP_SUMMARY
