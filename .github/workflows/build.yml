name: Build OptimizerX Deb

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build rootless .deb
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set Theos env
        run: |
          echo "THEOS=$HOME/theos"                     >> $GITHUB_ENV
          echo "THEOS_MAKE_PATH=$HOME/theos/makefiles" >> $GITHUB_ENV

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-macos-cache-v1

      - name: Clone Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS

      - name: Download iOS 16.5 SDK
        run: |
          if [ -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            echo "✅ SDK đã có sẵn"
            exit 0
          fi
          rm -rf "$THEOS/sdks"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$THEOS/sdks"
          cd "$THEOS/sdks"
          git sparse-checkout set iPhoneOS16.5.sdk
          echo "✅ Đã tải xong iPhoneOS16.5.sdk:"
          ls -la iPhoneOS16.5.sdk

      - name: Build .deb
        run: |
          rm -rf .theos packages
          make package FINALPACKAGE=1

      - name: Verify package
        run: |
          ls -lh packages/
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          dpkg-deb -c packages/*.deb
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          dpkg-deb -I packages/*.deb

      - name: Rename output
        run: |
          mkdir -p dist
          VERSION=$(grep '^Version:' control | awk '{print $2}')
          cp packages/*.deb "dist/optimizerx_${VERSION}_iphoneos-arm64.deb"
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OptimizerX-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: OptimizerX-deb
          path: release

      - name: Add checksums
        run: |
          cd release
          sha256sum *.deb > SHA256SUMS.txt
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OptimizerX ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/*.deb
            release/SHA256SUMS.txt
